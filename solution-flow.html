<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>window.OM_SCENES = '[{"name":"Spot","dur":4.5,"desc":"Dashboard loads; resolution KPI drifts below baseline and the dip is flagged"},{"name":"Investigate","dur":4.5,"desc":"Side panel opens with a breakdown by agent; one agent stands out"},{"name":"Understand","dur":4.5,"desc":"AI summary explains the driver against the team baseline"},{"name":"Validate","dur":4.5,"desc":"Underlying interactions appear as evidence for the summary"},{"name":"Act","dur":6.5,"desc":"Interaction details open with QA-tagged dialogue; the manager approves the coaching recommendation"},{"name":"Reset","dur":1.2,"desc":"Overlays clear back to the starting dashboard for the loop"}]';</script>

<body>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#1A1714"/><text x="50" y="62" text-anchor="middle" font-family="Georgia,serif" font-size="34" fill="#D97757">SA</text></svg></template>
<div id="root"></div>
<script type="text/babel" src="animations-v3.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel">
const C={bg:'#1A1714',win:'#201E1A',tile:'#2A2724',line:'#3A3632',bar:'rgba(237,232,223,0.10)',bar2:'rgba(237,232,223,0.06)',t1:'#EDE8DF',t2:'#B8B3A8',t3:'#7A7670',acc:'#D97757',sage:'#85A67F',red:'#C56A4E'};
const SERIF="'Hedvig Letters Serif', Georgia, serif", SANS="'Plus Jakarta Sans', Helvetica, sans-serif";
const MOTION={enter:Easing.easeOutCubic,draw:Easing.easeInOutCubic,pop:Easing.easeOutBack};
const mix=(a,b,p)=>a+(b-a)*p;
function useP(){const {T}=useComposition();return (a,b,ease=MOTION.enter)=>ease(clamp((T-a)/(b-a),0,1));}
const WX=160,WY=140,WW=1280,WH=610;
const LABEL="'Satoshi', 'Plus Jakarta Sans', sans-serif";
const STEPS=[['Spot','Spot','A KPI drifts below its baseline'],['Investigate','Investigate','Drill down to find where it comes from'],['Understand','Understand','AI explains the likely driver'],['Validate','Validate','Evidence from real customer interactions'],['Act','Act','The manager reviews the evidence and approves targeted coaching']];

function Rail(){
  const {T,CUES}=useComposition();
  const ends=['Investigate','Understand','Validate','Act','Reset'];
  return <div style={{position:'absolute',left:WX,top:52,width:WW,display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:24}}>
    {STEPS.map(([k,l],i)=>{const a=CUES[k],b=CUES[ends[i]];const on=T>=a&&T<b;const fill=T>=CUES.Reset?0:clamp((T-a)/(b-a),0,1);
      return <div key={k}>
        <div style={{display:'flex',gap:12,alignItems:'baseline',fontFamily:SANS,fontSize:22,color:on?C.t1:(fill>=1?C.t2:C.t3),transition:'none'}}>
          <span style={{fontWeight:600,fontSize:17,letterSpacing:1.5,color:on?C.acc:C.t3}}>0{i+1}</span>{l}</div>
        <div style={{height:3,borderRadius:3,background:C.line,marginTop:14,overflow:'hidden'}}><div style={{height:'100%',width:fill*100+'%',background:C.acc,opacity:on?1:0.45}}></div></div>
      </div>;})}
  </div>;
}

function Caption(){
  const {T,CUES}=useComposition();
  const ends=['Investigate','Understand','Validate','Act','Reset'];
  return <div style={{position:'absolute',left:WX,top:WY+WH+36,width:WW,height:60}}>
    {STEPS.map(([k,,d],i)=>{const a=CUES[k],b=CUES[ends[i]];const o=clamp((T-a-0.1)/0.4,0,1)*clamp((b-T)/0.3,0,1);
      return <div key={k} style={{position:'absolute',left:0,top:0,display:'flex',alignItems:'center',gap:18,opacity:o,transform:`translateY(${(1-MOTION.enter(clamp((T-a-0.1)/0.5,0,1)))*8}px)`}}>
        <span style={{width:28,height:2,borderRadius:2,background:C.acc}}></span>
        <span style={{fontFamily:SANS,fontSize:24,lineHeight:1.4,color:C.t2,letterSpacing:-0.1}}>{d}</span>
      </div>;})}
  </div>;
}

const PTS=[150,138,146,132,142,136,150,202,222,216,230,226];
const px=i=>40+i*(1060/11);
function Dashboard(){
  const {T,CUES}=useComposition();const P=useP();
  const draw=P(0.2,1.8,MOTION.draw);
  const reset=P(CUES.Reset,CUES.Reset+0.9);
  const alert=P(CUES.Spot+2.0,CUES.Spot+2.5)*(1-reset);
  const pulse=alert>0?(Math.sin((T-2)*5)*0.5+0.5):0;
  const d=PTS.map((y,i)=>(i?'L':'M')+px(i)+' '+y).join(' ');
  const len=1400;
  const kpis=[['Volume','132k'],['Resolution','62.9%'],['Sentiment','+0.4'],['Escalations','8.1%']];
  return <div style={{position:'absolute',inset:0}}>
    <div style={{position:'absolute',left:0,top:0,width:64,bottom:0,borderRight:`1px solid ${C.line}`,display:'flex',flexDirection:'column',alignItems:'center',paddingTop:72,gap:26}}>
      {[0,1,2,3,4].map(i=><div key={i} style={{width:22,height:22,borderRadius:6,background:i===1?'rgba(217,119,87,0.35)':C.bar}}></div>)}
    </div>
    <div style={{position:'absolute',left:64,right:0,top:0,height:56,borderBottom:`1px solid ${C.line}`,display:'flex',alignItems:'center',gap:14,padding:'0 28px'}}>
      <div style={{width:170,height:14,borderRadius:7,background:C.bar}}></div>
      {[110,120,150].map((w,i)=><div key={i} style={{width:w,height:28,borderRadius:8,border:`1px solid ${C.line}`}}></div>)}
    </div>
    <div style={{position:'absolute',left:92,top:84,right:28,display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:18}}>
      {kpis.map(([k,v],i)=>{const hot=i===1;const o=1;
        return <div key={k} style={{height:104,borderRadius:12,background:C.tile,padding:'18px 20px',boxSizing:'border-box',opacity:o,border:`1px solid ${hot&&alert>0?`rgba(197,106,78,${0.3+0.5*alert})`:'transparent'}`}}>
          <div style={{fontFamily:SANS,fontSize:15,color:C.t3}}>{k}</div>
          <div style={{display:'flex',alignItems:'baseline',gap:10,marginTop:10}}>
            <span style={{fontFamily:SERIF,fontSize:32,color:C.t1}}>{v}</span>
            {hot&&<span style={{fontFamily:SANS,fontSize:15,fontWeight:600,color:C.red,opacity:alert}}>↓ 2.6</span>}
          </div></div>;})}
    </div>
    <div style={{position:'absolute',left:92,top:212,width:1160,height:330,borderRadius:12,background:C.tile}}>
      <div style={{position:'absolute',left:28,top:22,fontFamily:SANS,fontSize:16,color:C.t2}}>Resolution rate over time</div>
      <svg width="1160" height="330" style={{position:'absolute',inset:0}}>
                <rect x="40" y={126} width="1060" height={30} fill="rgba(133,166,127,0.10)" opacity={P(0.6,1.2)*(1-reset)}/>
        <line x1="40" x2="1100" y1="141" y2="141" stroke={C.sage} strokeOpacity={0.6*P(0.6,1.2)*(1-reset)} strokeDasharray="6 6"/>
        <text x="1100" y="116" textAnchor="end" fill={C.sage} fontFamily={SANS} fontSize="13" opacity={P(0.8,1.3)*(1-reset)}>Team baseline</text>
        <path d={d} fill="none" stroke="#9DB0E8" strokeWidth="3" strokeLinejoin="round" strokeDasharray={len} strokeDashoffset={len*(1-draw)} opacity={1-reset}/>
        <path d={PTS.slice(6).map((y,i)=>(i?'L':'M')+px(i+6)+' '+y).join(' ')} fill="none" stroke={C.red} strokeWidth="3.5" strokeLinejoin="round" opacity={alert}/>
        <circle cx={px(8)} cy={PTS[8]} r={10+pulse*14} fill="none" stroke={C.red} strokeOpacity={alert*(0.7-pulse*0.5)} strokeWidth="2"/>
        <circle cx={px(8)} cy={PTS[8]} r="6" fill={C.red} opacity={alert}/>
      </svg>
    </div>
    <div style={{position:'absolute',left:92,top:562,width:1160,display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:18}}>
      {[0,1,2].map(i=><div key={i} style={{height:50,borderRadius:10,background:C.bar2,opacity:1}}></div>)}
    </div>
  </div>;
}

function Panel(){
  const {T,CUES}=useComposition();const P=useP();
  const open=P(CUES.Investigate,CUES.Investigate+0.7)*(1-P(CUES.Reset,CUES.Reset+0.7,MOTION.draw));
  const inv=1-P(CUES.Understand,CUES.Understand+0.4);
  const und=P(CUES.Understand+0.3,CUES.Understand+0.8);
  const val=P(CUES.Validate,CUES.Validate+0.6);
  const rows=[['A-07',0.42],['A-11',0.55],['A-14',0.88],['A-22',0.38],['A-31',0.47],['A-36',0.33]];
  const hl=P(CUES.Investigate+2.6,CUES.Investigate+3.1);
  const sel=P(CUES.Investigate+3.9,CUES.Investigate+4.2);
  const s1="Pending rate is 3 pts above the team baseline, driven by billing adjustments and tariff queries.";
  const s2="41% of escalations were resolvable without policy exceptions: a coaching opportunity.";
  const ty=a=>Math.floor(clamp((T-a)/1.6,0,1)*1);
  const t1=s1.slice(0,Math.floor(clamp((T-CUES.Understand-0.9)/1.5,0,1)*s1.length));
  const t2=s2.slice(0,Math.floor(clamp((T-CUES.Understand-2.5)/1.3,0,1)*s2.length));
  const sumH=mix(0,1,val);
  return <div style={{position:'absolute',top:56,bottom:0,right:0,width:540,background:'#26231F',borderLeft:`1px solid ${C.line}`,boxShadow:'-30px 0 60px rgba(0,0,0,0.35)',transform:`translateX(${(1-open)*560}px)`,overflow:'hidden'}}>
    <div style={{position:'absolute',inset:0,padding:'28px 32px',opacity:inv}}>
      <div style={{fontFamily:SANS,fontSize:15,color:C.t3}}>Resolution · pending</div>
      <div style={{fontFamily:SERIF,fontSize:30,color:C.t1,marginTop:6}}>Breakdown by agent</div>
      <div style={{marginTop:24,display:'flex',flexDirection:'column',gap:14}}>
        {rows.map(([n,v],i)=>{const o=P(CUES.Investigate+0.8+i*0.15,CUES.Investigate+1.3+i*0.15);const hot=i===2;
          return <div key={n} style={{display:'grid',gridTemplateColumns:'70px 1fr 56px',alignItems:'center',gap:14,height:48,padding:'0 14px',borderRadius:10,opacity:o,background:hot?`rgba(197,106,78,${0.08*hl+0.1*sel})`:'transparent',border:`1px solid ${hot?`rgba(197,106,78,${0.5*hl})`:'transparent'}`}}>
            <span style={{fontFamily:SANS,fontSize:16,color:hot&&hl>0.5?C.t1:C.t2}}>{n}</span>
            <div style={{height:10,borderRadius:5,background:C.bar2}}><div style={{height:'100%',borderRadius:5,width:v*100*P(CUES.Investigate+1+i*0.15,CUES.Investigate+2+i*0.15)+'%',background:hot?mixColor(hl):'rgba(237,232,223,0.22)'}}></div></div>
            <span style={{fontFamily:SANS,fontSize:15,color:hot?C.red:C.t3,textAlign:'right',opacity:hot?hl:1}}>{hot?'↑ 3 pts':''}</span>
          </div>;})}
      </div>
    </div>
    <div style={{position:'absolute',inset:0,padding:'28px 32px',opacity:und}}>
      <div style={{fontFamily:SANS,fontSize:15,color:C.t3}}>← Agent A-14</div>
      <div style={{display:'flex',alignItems:'baseline',gap:14,marginTop:6}}>
        <span style={{fontFamily:SERIF,fontSize:30,color:C.t1}}>22% pending</span>
        <span style={{fontFamily:SANS,fontSize:14,fontWeight:600,color:C.red,padding:'4px 10px',borderRadius:20,background:'rgba(197,106,78,0.14)'}}>+3 pts vs baseline</span>
      </div>
      <div style={{marginTop:24,borderRadius:12,background:'rgba(217,119,87,0.07)',border:'1px solid rgba(217,119,87,0.28)',padding:'18px 20px',height:mix(232,122,sumH),boxSizing:'border-box',overflow:'hidden'}}>
        <div style={{fontFamily:SANS,fontSize:14,fontWeight:600,color:C.acc,letterSpacing:1}}>✦ AI SUMMARY</div>
        <div style={{fontFamily:SANS,fontSize:18,lineHeight:1.5,color:C.t1,marginTop:10,minHeight:54}}>{t1}</div>
        <div style={{fontFamily:SANS,fontSize:18,lineHeight:1.5,color:C.t2,marginTop:12,opacity:1-sumH}}>{t2}</div>
      </div>
      <div style={{marginTop:22,opacity:1-val}}>
        {[0,1,2].map(i=><div key={i} style={{display:'grid',gridTemplateColumns:'1fr 80px 60px',gap:14,padding:'12px 0',borderTop:`1px solid ${C.line}`,opacity:P(CUES.Understand+3.2+i*0.15,CUES.Understand+3.7+i*0.15)}}>
          <div style={{height:10,borderRadius:5,background:C.bar,width:['70%','60%','66%'][i]}}></div><div style={{height:10,borderRadius:5,background:C.bar}}></div><div style={{height:10,borderRadius:5,background:i===0?'rgba(197,106,78,0.5)':C.bar}}></div>
        </div>)}
      </div>
      <div style={{position:'absolute',left:32,right:32,top:250,opacity:val}}>
        <div style={{fontFamily:SANS,fontSize:14,fontWeight:600,color:C.t3,letterSpacing:1,marginBottom:14}}>SUPPORTING INTERACTIONS</div>
        {[['Tariff change','Resolved',C.sage],['Billing dispute','Pending',C.red],['Discount eligibility','Pending',C.red]].map(([a,b,c],i)=>{
          const o=P(CUES.Validate+0.4+i*0.25,CUES.Validate+0.9+i*0.25);const tag=i===1?P(CUES.Validate+2.2,CUES.Validate+2.6,MOTION.pop):0;
          return <div key={a} style={{borderRadius:12,background:C.tile,padding:'16px 18px',marginBottom:12,opacity:o,transform:`translateY(${(1-o)*16}px)`,border:`1px solid ${i===1?`rgba(217,119,87,${0.5*tag})`:'transparent'}`}}>
            <div style={{display:'flex',alignItems:'center',gap:12}}>
              <div style={{width:30,height:30,borderRadius:15,background:'rgba(157,176,232,0.18)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,color:'#9DB0E8'}}>☎</div>
              <div style={{height:10,width:110,borderRadius:5,background:C.bar}}></div>
              <span style={{marginLeft:'auto',fontFamily:SANS,fontSize:14,color:c}}>● {b}</span>
            </div>
            <div style={{fontFamily:SANS,fontSize:16,color:C.t2,marginTop:10}}>{a}</div>
            {i===1&&<div style={{marginTop:10,display:'inline-block',fontFamily:SANS,fontSize:13,fontWeight:600,color:C.acc,padding:'4px 10px',borderRadius:20,background:'rgba(217,119,87,0.14)',transform:`scale(${tag})`,transformOrigin:'left center'}}>Sentiment drops at 02:14 · no ownership of next step</div>}
          </div>;})}
      </div>
    </div>
  </div>;
}
function mixColor(p){const r=Math.round(mix(237,197,p)),g=Math.round(mix(232,106,p)),b=Math.round(mix(223,78,p));return `rgba(${r},${g},${b},${mix(0.22,1,p)})`;}

function Tag({kind,children,o=1,hl=0}){
  const bad=kind==='bad';
  return <div style={{display:'flex',alignItems:'center',gap:10,height:34,padding:'0 14px',borderRadius:17,fontFamily:SANS,fontSize:15,color:bad?'#E39A82':'#A9C4A3',background:bad?`rgba(197,106,78,${0.12+0.14*hl})`:'rgba(133,166,127,0.12)',border:`1px solid ${bad?`rgba(217,119,87,${0.55*hl})`:'transparent'}`,opacity:o}}>
    <span style={{width:16,height:16,borderRadius:8,background:bad?C.red:C.sage,color:'#1A1714',fontSize:11,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center'}}>{bad?'!':'✓'}</span>{children}</div>;
}
function InteractionPage(){
  const {T,CUES}=useComposition();const P=useP();
  const A=CUES.Act;
  const inP=P(A,A+0.7);const out=P(CUES.Reset,CUES.Reset+0.6);
  const o=inP*(1-out);
  const lines=[
    ['Agent','#1 · 5:21pm','Hello! Thank you for contacting customer support. How may I help?',[['good','Opening greeting']]],
    ['Customer','#2 · 5:21pm','I was charged twice on my last bill after the tariff change.',[]],
    ['Agent','#3 · 5:22pm','That should sort itself out next cycle.',[['bad','No ownership of next step']]],
    ['Customer','#4 · 5:23pm','So I just have to wait? That is not really a solution.',[]],
  ];
  const hl=P(A+2.6,A+3.0);
  const rec="Take ownership of billing issues: confirm the fix, give a clear timeline and follow up proactively.";
  const typed=rec.slice(0,Math.floor(clamp((T-A-1.3)/1.6,0,1)*rec.length));
  const press=P(A+4.5,A+4.7);const ok=press>0.5;
  const toast=P(A+4.9,A+5.4)*(1-out);
  return <div style={{position:'absolute',inset:0,background:C.win,opacity:1-out,transform:`translateX(${(1-inP)*WW}px)`,boxShadow:'-30px 0 60px rgba(0,0,0,0.4)'}}>
    <div style={{position:'absolute',left:0,top:0,width:64,bottom:0,borderRight:`1px solid ${C.line}`,display:'flex',flexDirection:'column',alignItems:'center',paddingTop:72,gap:26}}>
      {[0,1,2,3,4].map(i=><div key={i} style={{width:22,height:22,borderRadius:6,background:i===2?'rgba(217,119,87,0.35)':C.bar}}></div>)}
    </div>
    <div style={{position:'absolute',left:64,right:0,top:0,height:64,borderBottom:`1px solid ${C.line}`,display:'flex',alignItems:'center',gap:16,padding:'0 28px',fontFamily:SANS,fontSize:17,color:C.t3}}>
      <span style={{color:C.t2}}>←</span><span style={{fontFamily:SERIF,fontSize:22,color:C.t1}}>Customer C-2187</span>
      <span>Interaction · A-14 · Billing dispute · 6m 12s · Outbound</span>
    </div>
    <div style={{position:'absolute',left:92,top:88,width:700,bottom:24,borderRadius:12,background:C.tile,padding:'20px 24px',boxSizing:'border-box',overflow:'hidden'}}>
      <div style={{fontFamily:SANS,fontSize:17,fontWeight:600,color:C.t1}}>Transcript</div>
      <div style={{marginTop:14,display:'flex',flexDirection:'column',gap:14}}>
        {lines.map(([who,meta,txt,tags],i)=>{const lo=P(A+0.6+i*0.3,A+1.0+i*0.3);
          return <div key={i} style={{opacity:lo,transform:`translateY(${(1-lo)*10}px)`,padding:'12px 14px',borderRadius:10,background:i===2?`rgba(197,106,78,${0.06*hl})`:'transparent'}}>
            <div style={{display:'flex',justifyContent:'space-between',fontFamily:SANS,fontSize:15}}><span style={{fontWeight:600,color:C.t2}}>{who}</span><span style={{color:C.t3}}>{meta}</span></div>
            <div style={{fontFamily:SANS,fontSize:17,lineHeight:1.45,color:C.t1,marginTop:6}}>{txt}</div>
            {tags.length>0&&<div style={{display:'flex',gap:8,marginTop:10}}>{tags.map(([k,l])=><Tag key={l} kind={k} hl={k==='bad'?hl:0}>{l}</Tag>)}</div>}
          </div>;})}
      </div>
    </div>
    <div style={{position:'absolute',left:812,top:88,right:24,height:54,borderRadius:12,background:C.tile,display:'flex',alignItems:'center',gap:30,padding:'0 24px',fontFamily:SANS,fontSize:16,color:C.t3}}>
      <span>Insights</span><span>Quality</span><span style={{color:C.t1,position:'relative'}}>Skills<span style={{position:'absolute',left:0,right:0,bottom:-17,height:2,background:C.acc}}></span></span><span>Feedback</span>
    </div>
    <div style={{position:'absolute',left:812,top:156,right:24,bottom:24,borderRadius:12,background:C.tile,padding:'20px 22px',boxSizing:'border-box'}}>
      <div style={{fontFamily:SANS,fontSize:17,fontWeight:600,color:C.t1}}>Skill assessment</div>
      <div style={{fontFamily:SANS,fontSize:14,color:C.t3,marginTop:4}}>Generated by AI ✦</div>
      <div style={{marginTop:16,borderRadius:12,background:'rgba(217,119,87,0.07)',border:`1px solid rgba(217,119,87,${0.28+0.4*hl})`,padding:'16px 18px',height:232,boxSizing:'border-box',position:'relative'}}>
        <div style={{fontFamily:SANS,fontSize:16,fontWeight:600,color:C.t1}}>Coaching recommendation</div>
        <div style={{fontFamily:LABEL,fontSize:12,fontWeight:900,letterSpacing:1.4,color:C.acc,marginTop:12}}>FOCUS BEHAVIOUR</div>
        <div style={{fontFamily:SANS,fontSize:16,color:C.t1,marginTop:4}}>Solution ownership</div>
        <div style={{fontFamily:LABEL,fontSize:12,fontWeight:900,letterSpacing:1.4,color:C.acc,marginTop:12}}>RECOMMENDATION</div>
        <div style={{fontFamily:SANS,fontSize:15,lineHeight:1.5,color:C.t2,marginTop:4,height:46}}>{typed}</div>
        <div style={{position:'absolute',left:18,bottom:16,fontFamily:SANS,fontSize:13,color:C.t3,opacity:hl}}>Linked to dialogue #3</div>
        <div style={{position:'absolute',right:18,bottom:12,display:'flex',gap:10}}>
          <div style={{fontFamily:SANS,fontSize:15,color:C.t2,padding:'8px 16px',borderRadius:8,border:`1px solid ${C.line}`}}>Edit</div>
          <div style={{fontFamily:SANS,fontSize:15,fontWeight:600,padding:'8px 16px',borderRadius:8,minWidth:84,textAlign:'center',background:ok?C.sage:C.acc,color:'#1A1714',transform:`scale(${1-0.06*Math.sin(press*Math.PI)})`}}>{ok?'Approved ✓':'Approve'}</div>
        </div>
      </div>
      {[['Strengths','4',C.sage],['Needs improvement','1',C.red]].map(([l,n,c],i)=><div key={l} style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginTop:10,height:40,padding:'0 16px',borderRadius:10,border:`1px solid ${C.line}`,fontFamily:SANS,fontSize:15,color:C.t2,opacity:P(A+1+i*0.15,A+1.4+i*0.15)}}>
        <span>{l}</span><span style={{color:c,fontWeight:600}}>{n}</span></div>)}
    </div>
    <div style={{position:'absolute',left:92,bottom:40,width:520,borderRadius:12,background:'#33302B',border:`1px solid ${C.line}`,padding:'14px 20px',boxSizing:'border-box',fontFamily:SANS,fontSize:16,color:C.t1,display:'flex',alignItems:'center',gap:12,opacity:toast,transform:`translateY(${(1-toast)*16}px)`,boxShadow:'0 20px 40px rgba(0,0,0,0.4)'}}>
      <span style={{color:C.sage}}>●</span>Coaching assigned to team lead · tracked against baseline
    </div>
  </div>;
}

function Cursor(){
  const {T,CUES}=useComposition();
  const K=[
    [0,980,720],[CUES.Spot+2.6,980,720],[CUES.Spot+3.6,WX+92+px(8)+4,WY+212+PTS[8]+4],
    [CUES.Investigate+3.0,WX+92+px(8)+4,WY+212+PTS[8]+4],[CUES.Investigate+3.8,WX+WW-540+180,WY+56+28+40+6+30+24+2*62+24],
    [CUES.Understand+0.5,WX+WW-540+180,WY+56+28+40+6+30+24+2*62+24],[CUES.Understand+2.0,WX+WW-300,WY+420],
    [CUES.Validate+1.2,WX+WW-300,WY+420],[CUES.Validate+2.1,1060,700],[CUES.Validate+3.2,1060,700],[CUES.Validate+3.8,1120,672],
    [CUES.Act+3.3,1120,672],[CUES.Act+4.3,WX+WW-24-18-80,WY+156+20+22+4+16+232-12-16],
    [CUES.Reset,WX+WW-24-18-80,WY+156+20+22+4+16+232-12-16],[CUES.Reset+1.2,980,720]];
  let x=K[0][1],y=K[0][2];
  for(let i=0;i<K.length-1;i++){const [a,x1,y1]=K[i],[b,x2,y2]=K[i+1];if(T>=a&&T<=b){const p=MOTION.draw(b>a?(T-a)/(b-a):1);x=mix(x1,x2,p);y=mix(y1,y2,p);break;}if(T>b){x=x2;y=y2;}}
  const clicks=[CUES.Spot+3.7,CUES.Investigate+3.9,CUES.Validate+3.9,CUES.Act+4.5];
  let ring=0;clicks.forEach(c=>{const d=T-c;if(d>=0&&d<0.5)ring=d/0.5;});
  const op=Math.min(clamp(T/0.4,0,1),1);
  return <div style={{position:'absolute',left:x,top:y,pointerEvents:'none',opacity:op}}>
    {ring>0&&<div style={{position:'absolute',left:-18-ring*14,top:-18-ring*14,width:36+ring*28,height:36+ring*28,borderRadius:'50%',border:`2px solid rgba(217,119,87,${1-ring})`}}></div>}
    <svg width="28" height="32" viewBox="0 0 28 32" style={{position:'absolute',left:-3,top:-2,filter:'drop-shadow(0 3px 6px rgba(0,0,0,0.5))'}}><path d="M3 2 L3 26 L9.5 20 L14 30 L18 28 L13.5 18.5 L22 18.5 Z" fill="#EDE8DF" stroke="#1A1714" strokeWidth="1.6" strokeLinejoin="round"/></svg>
  </div>;
}

function Piece(){
  const {T,CUES}=useComposition();
  const ref=React.useRef(null);
  React.useEffect(()=>{const el=ref.current&&ref.current.closest('[data-om-exportable-video-with-duration-secs]');if(el)el.setAttribute('data-screen-label','t='+Math.floor(T)+'s');},[Math.floor(T)]);
  const cam=[[0,1,0,0],[authoredEnd(CUES),1,0,0]];
  let s=1,cx=0,cy=0;
  for(let i=0;i<cam.length-1;i++){const [a,s1,x1,y1]=cam[i],[b,s2,x2,y2]=cam[i+1];if(T>=a&&T<=b){const p=MOTION.draw(b>a?(T-a)/(b-a):1);s=mix(s1,s2,p);cx=mix(x1,x2,p);cy=mix(y1,y2,p);break;}}
  return <div ref={ref} style={{position:'absolute',inset:0,background:C.bg,overflow:'hidden'}}>
    <Rail/>
    <div style={{position:'absolute',left:WX,top:WY,width:WW,height:WH,borderRadius:16,background:C.win,border:`1px solid ${C.line}`,overflow:'hidden',boxShadow:'0 40px 90px -30px rgba(0,0,0,0.6)'}}>
      <div style={{position:'absolute',inset:0,transform:`translate(${cx}px,${cy}px) scale(${s})`,transformOrigin:'50% 50%'}}>
        <Dashboard/>
        <Panel/>
        <InteractionPage/>
      </div>
    </div>
    <Caption/>
    <Cursor/>
  </div>;
}
function authoredEnd(CUES){return CUES.Reset+1.2;}
const EMBED=new URLSearchParams(location.search).has('embed')||window.name==='solution-video'||(function(){try{return !!(window.frameElement&&window.frameElement.closest('.solution-video'));}catch(e){return false;}})();
if(EMBED){const st=document.createElement('style');st.textContent='[data-om-starter]{background:#1A1714 !important}[data-om-starter]>div:last-child,[data-om-starter]>div:not(:first-child){display:none !important}[data-om-starter] svg{box-shadow:none !important}';document.head.appendChild(st);}

function App(){
  const [t,setTweak]=useTweaks(window.TWEAK_DEFAULTS);
  return <React.Fragment>
    <CompositionStage width={1600} height={900} bg={C.bg} scenes={window.OM_SCENES} playback={window.OM_PLAYBACK}><Piece/></CompositionStage>
    {!EMBED&&<TweaksPanel><TweakSection label="Video"><TweakToggle label="Motion editor" value={t.motionEditor} onChange={v=>setTweak('motionEditor',v)}/></TweakSection></TweaksPanel>}
  </React.Fragment>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
